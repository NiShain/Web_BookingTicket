{% extends 'admin/base_admin.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Quản lý Xe</h2>
    <a href="{% url 'admin_panel:admin_xe_create' %}" class="btn btn-primary"><i class="fas fa-plus"></i> Thêm Xe mới</a>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Biển số</th>
                    <th>Loại xe</th>
                    <th>Số ghế</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody>
                {% for xe in xes %}
                <tr>
                    <td><strong>{{ xe.bien_so }}</strong></td>
                    <td>{{ xe.loai_xe }}</td>
                    <td>{{ xe.so_ghe }} chỗ</td>
                    <td>
                        <a href="{% url 'admin_panel:admin_xe_update' xe.pk %}" class="btn btn-sm btn-warning">Sửa</a>
                        <a href="{% url 'admin_panel:admin_xe_delete' xe.pk %}" class="btn btn-sm btn-danger">Xóa</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
