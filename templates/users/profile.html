<h2>Hồ sơ cá nhân</h2>
{% if messages %}
  <ul class="messages">
    {% for message in messages %}
      <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
    {% endfor %}
  </ul>
{% endif %}

<form method="post">
  {% csrf_token %}
  <label>Họ tên</label>
  <input name="ten" value="{{ khach_hang.ten }}" />

  <label>Số điện thoại</label>
  <input name="so_dien_thoai" value="{{ khach_hang.so_dien_thoai }}" />

  <label>CCCD</label>
  <input name="cccd" value="{{ khach_hang.cccd }}" />

  <label>Email</label>
  <input name="email" value="{{ khach_hang.email }}" />

  <button type="submit">Lưu</button>
</form>

<h3>Vé đã đặt</h3>
<ul>
  {% for ve in ve_da_dat %}
    <li>{{ ve }} - trạng thái: {{ ve.trang_thai }}</li>
  {% empty %}
    <li>Chưa có vé</li>
  {% endfor %}
</ul>
